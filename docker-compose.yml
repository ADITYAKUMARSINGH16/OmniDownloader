services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: omnidownload-backend
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./temp:/app/temp
      - ./data:/app/data
      - ./backend:/app
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - TEMP_DIR=/app/temp
      - DATABASE_URL=sqlite+aiosqlite:////app/data/omnidownload.db
      - DEBUG=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: omnidownload-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  downloads:
  temp:
  data: