<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniDownload</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1f2937;
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #3b82f6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }
    .title {
      font-weight: 600;
      font-size: 16px;
    }
    .subtitle {
      font-size: 12px;
      color: #6b7280;
    }
    .status {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .status-dot.disconnected {
      background: #ef4444;
    }
    .status-text {
      font-size: 13px;
      color: #374151;
    }
    .url-input {
      padding: 0 16px 16px;
    }
    .url-input label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #374151;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .input-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .input-group button {
      padding: 8px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .input-group button:hover {
      background: #2563eb;
    }
    .input-group button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .detected-media {
      padding: 0 16px 16px;
      border-top: 1px solid #e5e7eb;
      margin-top: 8px;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .media-list {
      max-height: 320px;
      overflow-y: auto;
    }
    .media-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 6px;
      background: #f9fafb;
      margin-bottom: 6px;
    }
    .media-item:last-child {
      margin-bottom: 0;
    }
    .media-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .media-info {
      flex: 1;
      min-width: 0;
    }
    .media-url {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-type {
      font-size: 10px;
      color: #9ca3af;
      text-transform: uppercase;
    }
    .media-btn {
      padding: 4px 8px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .media-btn:hover {
      background: #2563eb;
    }
    .no-media {
      padding: 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }
    .footer-btn {
      flex: 1;
      padding: 8px;
      background: #f3f4f6;
      color: #374151;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .footer-btn:hover {
      background: #e5e7eb;
    }
    .footer-btn.primary {
      background: #3b82f6;
      color: white;
    }
    .footer-btn.primary:hover {
      background: #2563eb;
    }
    .error {
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      color: #dc2626;
      font-size: 12px;
      margin: 0 16px 16px;
    }
    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⬇</div>
    <div>
      <div class="title">OmniDownload</div>
      <div class="subtitle">Universal Media Downloader</div>
    </div>
  </div>
  
  <div class="status">
    <div class="status-dot disconnected" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking connection...</span>
  </div>
  
  <div class="url-input">
    <label for="urlInput">Paste URL to download</label>
    <div class="input-group">
      <input type="url" id="urlInput" placeholder="https://example.com/video" />
      <button id="analyzeBtn">Analyze</button>
    </div>
    <div id="errorMsg" class="error" style="display: none;"></div>
  </div>
  
  <div class="detected-media">
    <div class="section-title">
      <span>Detected Media</span>
      <span id="mediaCount">0</span>
    </div>
    <div class="media-list" id="mediaList">
      <div class="no-media">No supported media detected on this page</div>
    </div>
  </div>
  
  <div class="cookie-sync-section" style="padding: 0 16px 12px;">
    <button id="syncCookiesBtn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
      <span>🔑</span>
      <span>Sync Browser Cookies to OmniDownload</span>
    </button>
    <div id="cookieSyncMsg" style="display: none; font-size: 11px; margin-top: 4px; text-align: center;"></div>
  </div>
  
  <div class="footer">
    <button class="footer-btn primary" id="openAppBtn">Open OmniDownload</button>
    <button class="footer-btn" id="settingsBtn">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
